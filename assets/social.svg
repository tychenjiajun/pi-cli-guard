<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>pi-cli-guard — rewrites the model's bash commands to the modern toolchain: grep → rg and a conservative find → fd subset</title>
  <desc>pi-cli-guard mutates the bash tool_call input so legacy commands become ripgrep and fd: grep -rn 'FAIL\|Test Files' . becomes rg --with-filename -n 'FAIL|Test Files' ., and find . -type f -name '*.py' becomes fd -t f -g -s '*.py' . — with a notice shown to the model and a details.piCliGuard contract.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0b14"/>
      <stop offset="0.55" stop-color="#110f1d"/>
      <stop offset="1" stop-color="#0d0c17"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .code { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 15.5px; }
      .kw   { fill: #c792ea; }
      .fn   { fill: #82aaff; }
      .str  { fill: #7ee787; }
      .num  { fill: #f2cc60; }
      .pun  { fill: #8b849c; }
      .pl   { fill: #e6e1f5; }
      .cm   { fill: #6b7391; }
      .key  { fill: #79c0ff; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="1060" cy="40" rx="460" ry="320" fill="url(#glowA)"/>
  <ellipse cx="120" cy="600" rx="420" ry="300" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- header -->
  <rect x="60" y="44" width="146" height="32" rx="16" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-opacity="0.7"/>
  <text x="133" y="65" font-size="14" font-weight="700" fill="#c4b5fd" text-anchor="middle" letter-spacing="0.5">pi extension</text>
  <text x="1140" y="65" font-size="14" font-weight="600" fill="#6f6a85" text-anchor="end" letter-spacing="0.5">MIT · TypeScript strict · 138 tests</text>

  <!-- title -->
  <text x="60" y="140" font-size="46" font-weight="800" fill="#f6f4ff" letter-spacing="-0.5">pi-cli-guard</text>
  <text x="61" y="178" font-size="19" fill="#9a94b3">The model writes <tspan fill="#f87171" font-weight="600">legacy</tspan> bash — it runs the <tspan fill="#34d399" font-weight="600">modern</tspan> toolchain</text>

  <!-- left: what the model wrote -->
  <g filter="url(#soft)">
    <rect x="60" y="215" width="470" height="250" rx="16" fill="#0f0e18" stroke="#2b2745" stroke-width="1.5"/>
  </g>
  <path d="M60,231 a16,16 0 0 1 16,-16 h438 a16,16 0 0 1 16,16 v24 h-470 z" fill="#1a1828"/>
  <line x1="60" y1="255" x2="530" y2="255" stroke="#2b2745" stroke-width="1.5"/>
  <text x="86" y="240" class="code" font-size="13.5" fill="#8f89a8">tool_call · event.input.command</text>
  <text x="86" y="298" class="code" xml:space="preserve"><tspan class="pl">grep -rn </tspan><tspan class="str">'FAIL\|Test Files'</tspan><tspan class="pl"> .</tspan></text>
  <text x="86" y="332" class="code" xml:space="preserve"><tspan class="pl">find . -type f -name </tspan><tspan class="str">'*.py'</tspan><tspan class="pl"> | head -30</tspan></text>
  <text x="86" y="384" class="code" font-size="13" fill="#f87171">legacy · slower · not .gitignore-aware</text>
  <text x="86" y="410" class="code" font-size="13" fill="#6f6a85">6,888 grep writes vs 1,648 rg across</text>
  <text x="86" y="430" class="code" font-size="13" fill="#6f6a85">real sessions — a prompt line is not enough</text>

  <!-- arrow -->
  <line x1="540" y1="340" x2="600" y2="340" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- right: what runs -->
  <g filter="url(#soft)">
    <rect x="612" y="215" width="528" height="250" rx="16" fill="#0f0e18" stroke="#3b3566" stroke-width="1.5"/>
  </g>
  <path d="M612,231 a16,16 0 0 1 16,-16 h496 a16,16 0 0 1 16,16 v24 h-528 z" fill="#1a1828"/>
  <line x1="612" y1="255" x2="1140" y2="255" stroke="#3b3566" stroke-width="1.5"/>
  <text x="638" y="240" class="code" font-size="13.5" fill="#8f89a8">what actually executes</text>

  <text x="638" y="298" class="code" xml:space="preserve"><tspan class="pl">rg --with-filename -n </tspan><tspan class="str">'FAIL|Test Files'</tspan><tspan class="pl"> .</tspan></text>
  <text x="638" y="332" class="code" xml:space="preserve"><tspan class="pl">fd -t f -g -s </tspan><tspan class="str">'*.py'</tspan><tspan class="pl"> . | head -30</tspan></text>

  <text x="638" y="384" class="code" font-size="15"><tspan fill="#f5b642">🛡</tspan><tspan fill="#c4b5fd" font-weight="700"> pi-cli-guard</tspan><tspan class="cm"> · grep → rg (ripgrep) · find → fd</tspan></text>
  <text x="638" y="410" class="code" font-size="13.5" fill="#34d399">[pi-cli-guard] Rewrote bash command(s) …</text>
  <text x="638" y="434" class="code" font-size="13.5" fill="#79c0ff">details.piCliGuard · versioned · composable</text>
  <text x="638" y="456" class="code" font-size="13.5" fill="#f5b642">refuses rather than guesses — BRE &amp; find kept</text>

  <!-- bottom stats -->
  <g opacity="0.96">
    <rect x="60" y="497" width="240" height="76" rx="14" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="86" y="528" font-size="24" font-weight="800" fill="#f6f4ff">93%</text>
    <text x="86" y="550" font-size="13.5" fill="#8f89a8">real grep calls now rewritten to rg</text>

    <rect x="326" y="497" width="240" height="76" rx="14" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="352" y="528" font-size="24" font-weight="800" fill="#f6f4ff">11,030</text>
    <text x="352" y="550" font-size="13.5" fill="#8f89a8">BRE alternations unlocked (of 11,829)</text>

    <rect x="592" y="497" width="240" height="76" rx="14" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="618" y="528" font-size="24" font-weight="800" fill="#f6f4ff">2 rules</text>
    <text x="618" y="550" font-size="13.5" fill="#8f89a8">grep → rg · find → fd, capability-aware</text>

    <rect x="858" y="497" width="282" height="76" rx="14" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="884" y="528" font-size="24" font-weight="800" fill="#f6f4ff">138</text>
    <text x="884" y="550" font-size="13.5" fill="#8f89a8">tests, incl. real-binary equivalence</text>
  </g>
</svg>