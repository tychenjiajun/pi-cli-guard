<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="pi-cli-guard promo card">
  <!-- 16:10 gallery card. Design rules: readable at a 168px-wide center crop,
       content inside the centered 80% safe area (x 160..1440), min secondary font 28px. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L5,10 L10,0 z" fill="#a78bfa"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .sys  { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .str  { fill: #7ee787; }
      .pl   { fill: #e6e1f5; }
      .pun  { fill: #8b849c; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#0d0d12"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- corner labels -->
  <rect x="140" y="90" rx="8" width="300" height="56" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text class="mono" x="290" y="128" text-anchor="middle" font-size="30" fill="#c4b5fd">pi extension</text>
  <text class="mono" x="1460" y="128" text-anchor="end" font-size="30" fill="#8b8b9e">pi.dev/packages</text>

  <!-- name -->
  <text class="mono" x="800" y="310" text-anchor="middle" font-size="130" font-weight="700" fill="#ffffff">pi-cli-guard</text>

  <!-- tagline -->
  <text class="sys" x="800" y="392" text-anchor="middle" font-size="44" fill="#c9c9d4">the model writes <tspan fill="#f87171" font-weight="600">legacy</tspan> bash — it runs <tspan fill="#34d399" font-weight="600">rg</tspan> &amp; <tspan fill="#34d399" font-weight="600">fd</tspan></text>

  <!-- before → after panel -->
  <rect x="240" y="444" rx="16" width="1120" height="256" fill="#101017" stroke="#2b2745" stroke-width="2"/>

  <rect x="272" y="478" rx="22" width="170" height="46" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.8"/>
  <text class="mono" x="357" y="509" text-anchor="middle" font-size="28" fill="#f87171">before</text>
  <text class="mono" x="900" y="512" text-anchor="middle" font-size="34" xml:space="preserve"><tspan class="pun">$ </tspan><tspan class="pl">grep -rn </tspan><tspan class="str">'FAIL\|Test Files'</tspan><tspan class="pl"> .</tspan></text>

  <line x1="357" y1="544" x2="357" y2="576" stroke="#a78bfa" stroke-width="3" marker-end="url(#down)"/>

  <rect x="272" y="606" rx="22" width="170" height="46" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.8"/>
  <text class="mono" x="357" y="637" text-anchor="middle" font-size="28" fill="#34d399">after</text>
  <text class="mono" x="900" y="640" text-anchor="middle" font-size="34" xml:space="preserve"><tspan class="pun">$ </tspan><tspan class="pl">rg --with-filename -n </tspan><tspan class="str">'FAIL|Test Files'</tspan><tspan class="pl"> .</tspan></text>

  <!-- install pill -->
  <rect x="390" y="744" rx="14" width="820" height="92" fill="#16161d" stroke="url(#accent)" stroke-width="3"/>
  <text class="mono" x="800" y="802" text-anchor="middle" font-size="42" fill="#a78bfa">$ pi install npm:pi-cli-guard</text>

  <!-- footer -->
  <text class="sys" x="800" y="898" text-anchor="middle" font-size="30" fill="#8b8b9e">grep → rg (ripgrep) · find → fd · rewrites at the tool_call seam · composes with other bash extensions</text>
  <rect x="440" y="936" width="720" height="10" rx="5" fill="url(#accent)"/>
</svg>
