    <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#6b7391">$ </tspan><tspan fill="#a78bfa">pi install npm:pi-cli-guard</tspan></text>
    <text x="96" y="312" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#c4b5fd">→ loaded as a pi extension (pi-package keyword)</tspan></text>
