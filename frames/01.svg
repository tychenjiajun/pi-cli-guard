<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="before — the model writes legacy bash">
  <rect width="1280" height="800" fill="#0d0d12"/>

  <rect x="48" y="40" rx="8" width="260" height="52" fill="#f87171" fill-opacity="0.14" stroke="#f87171"/>
  <text x="178" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#f87171">before</text>

  <rect x="48" y="128" rx="16" width="1184" height="624" fill="#101017" stroke="#26262f" stroke-width="2"/>
  <rect x="48" y="128" rx="16" width="1184" height="64" fill="#16161d"/>
  <circle cx="92" cy="160" r="10" fill="#ff5f57"/>
  <circle cx="124" cy="160" r="10" fill="#febc2e"/>
  <circle cx="156" cy="160" r="10" fill="#28c840"/>
  <text x="640" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#8b8b9e">the model writes bash</text>

    <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#6b7391">$ </tspan><tspan>grep -rn </tspan><tspan fill="#7ee787">'FAIL\|Test Files'</tspan><tspan> .</tspan></text>
    <text x="96" y="312" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#6b7391">$ find . -type f -name </tspan><tspan fill="#7ee787">'*.py'</tspan><tspan> | head -30</tspan></text>
    <text x="96" y="360" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#f87171">legacy tools — slow, not .gitignore-aware</tspan></text>
    <text x="96" y="408" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#8b8b9e">6,888 grep vs 1,648 rg across real sessions</tspan></text>
    <text x="96" y="456" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#8b8b9e">the prompt says "use rg" — the model doesn't</tspan></text>
</svg>
