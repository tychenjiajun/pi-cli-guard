<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="pi-cli-guard rewrites the command in the tool_call event">
  <rect width="1280" height="800" fill="#0d0d12"/>

  <rect x="48" y="40" rx="8" width="260" height="52" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="178" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#7c3aed">tool_call</text>

  <rect x="48" y="128" rx="16" width="1184" height="624" fill="#101017" stroke="#26262f" stroke-width="2"/>
  <rect x="48" y="128" rx="16" width="1184" height="64" fill="#16161d"/>
  <circle cx="92" cy="160" r="10" fill="#ff5f57"/>
  <circle cx="124" cy="160" r="10" fill="#febc2e"/>
  <circle cx="156" cy="160" r="10" fill="#28c840"/>
  <text x="640" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#8b8b9e">pi-cli-guard rewrites event.input.command</text>

    <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#4b5163">$ </tspan><tspan fill="#6b7391">grep -rn </tspan><tspan fill="#5b6478">'FAIL\|Test Files'</tspan><tspan fill="#6b7391"> .</tspan></text>
    <text x="96" y="312" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#4b5163">$ find . -type f -name </tspan><tspan fill="#5b6478">'*.py'</tspan><tspan fill="#6b7391"> | head -30</tspan></text>
    <text x="96" y="360" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#a78bfa">▼ rewriting in the tool_call event — no tool override</tspan></text>
    <text x="96" y="408" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#34d399">[pi-cli-guard] grep → rg · find → fd</tspan></text>
    <text x="96" y="456" font-family="ui-monospace, Menlo, monospace" font-size="34" xml:space="preserve" fill="#e6e6ef"><tspan fill="#8b8b9e">refuses rather than guesses (BRE, find edge cases)</tspan></text>
</svg>
